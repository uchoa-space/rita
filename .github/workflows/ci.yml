# ADR 020: the gate is one script. This workflow calls bin/ci and nothing else.
name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # ADR 019: key by model id once the embedder lands; until then the lock is the id.
      - name: Cache embedder model
        uses: actions/cache@v4
        with:
          path: ~/.cache/informers
          key: informers-${{ hashFiles('Gemfile.lock') }}

      - name: Run the gate
        run: bin/ci
